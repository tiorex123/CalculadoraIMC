<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>
        <p class="subtitle">Descubra seu Índice de Massa Corporal</p>

        <div class="form-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 70" required>
        </div>

        <div class="form-group">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
        </div>

        <button id="btn-calcular">Calcular</button>

        <div id="resultado" class="hidden">
            <h2>Resultado</h2>
            <p id="valor-imc"></p>
            <p id="classificacao"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
